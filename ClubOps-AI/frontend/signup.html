<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClubOps AI — Create account</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page page--signup">

  <!-- LEFT: brand / membership card panel -->
  <aside class="brand-panel">
    <div class="card-punch" aria-hidden="true"></div>
    <div class="brand-top">
      <div class="wordmark">
        <span class="wordmark-main">ClubOps</span><span class="wordmark-ai">AI</span>
      </div>
      <p class="tagline">Get set up in a minute — the club takes it from there.</p>
    </div>

    <div class="member-strip">
      <div class="member-strip-row">
        <span class="member-label">Creating account as</span>
        <span id="brandRoleLabel" class="member-value">Student</span>
      </div>
      <div class="member-strip-row">
        <span class="member-label">Status</span>
        <span class="member-value member-value--dot">Not yet a member</span>
      </div>
    </div>

    <ul class="brand-features" id="brandFeatures">
      <!-- filled per role by script.js -->
    </ul>
  </aside>

  <!-- RIGHT: form panel -->
  <main class="form-panel">
    <div class="form-wrap">

      <div class="form-header">
        <h1>Create your account</h1>
        <p>Tell us how you're joining in, then fill in your details.</p>
      </div>

      <!-- Role tabs styled as patches -->
      <div class="role-tabs" role="tablist" aria-label="Choose account type">
        <button class="role-tab is-active" data-role="student" role="tab" aria-selected="true" type="button">
          <span class="role-tab-title">Student</span>
          <span class="role-tab-sub">Club member</span>
        </button>
        <button class="role-tab" data-role="head" role="tab" aria-selected="false" type="button">
          <span class="role-tab-title">Club Head</span>
          <span class="role-tab-sub">Runs the club</span>
        </button>
        <button class="role-tab" data-role="volunteer" role="tab" aria-selected="false" type="button">
          <span class="role-tab-title">Volunteer</span>
          <span class="role-tab-sub">Event support</span>
        </button>
      </div>

      <form id="signupForm" novalidate>

        <!-- Shared: full name -->
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" placeholder="e.g. Ananya Sharma" autocomplete="name">
          <p class="field-error" data-error-for="fullName"></p>
        </div>

        <!-- Student-only fields -->
        <div class="field field--conditional" data-for="student">
          <label for="rollNo">Roll number</label>
          <input type="text" id="rollNo" name="rollNo" placeholder="e.g. 22CS1042" autocomplete="off">
          <p class="field-error" data-error-for="rollNo"></p>
        </div>
        <div class="field field--conditional" data-for="student">
          <label for="department">Department / year</label>
          <input type="text" id="department" name="department" placeholder="e.g. CSE, 2nd year" autocomplete="off">
          <p class="field-error" data-error-for="department"></p>
        </div>

        <!-- Club Head-only fields -->
        <div class="field field--conditional" data-for="head" hidden>
          <label for="clubName">Club name</label>
          <input type="text" id="clubName" name="clubName" placeholder="e.g. Robotics Club" autocomplete="off">
          <p class="field-error" data-error-for="clubName"></p>
        </div>
        <div class="field field--conditional" data-for="head" hidden>
          <label for="clubCategory">Club category</label>
          <input type="text" id="clubCategory" name="clubCategory" placeholder="e.g. Technical, Cultural, Sports" autocomplete="off">
          <p class="field-error" data-error-for="clubCategory"></p>
        </div>

        <!-- Volunteer-only fields -->
        <div class="field field--conditional" data-for="volunteer" hidden>
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" placeholder="e.g. 98765 43210" autocomplete="off">
          <p class="field-error" data-error-for="phone"></p>
        </div>
        <div class="field field--conditional" data-for="volunteer" hidden>
          <label for="interest">Area of interest</label>
          <input type="text" id="interest" name="interest" placeholder="e.g. Logistics, Design, Outreach" autocomplete="off">
          <p class="field-error" data-error-for="interest"></p>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@college.edu" autocomplete="username">
          <p class="field-error" data-error-for="email"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password">
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">Show</button>
          </div>
          <p class="field-error" data-error-for="password"></p>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
            <button type="button" class="toggle-pw" id="toggleConfirmPw" aria-label="Show password">Show</button>
          </div>
          <p class="field-error" data-error-for="confirmPassword"></p>
        </div>

        <div class="field-row field-row--terms">
          <label class="remember">
            <input type="checkbox" id="terms" name="terms">
            <span>I agree to the club's code of conduct</span>
          </label>
        </div>

        <p class="field-error" data-error-for="terms"></p>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span id="submitLabel">Create Student account</span>
        </button>
      </form>

      <p class="signup-line">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

</div>

<script src="./js/signup.js"></script>
</body>
</html>
