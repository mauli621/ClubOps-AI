<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>ClubOps AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Login / Signup screen -->
<div id="authRoot"></div>

<div id="app" style="display:none;">
    <aside class="sidebar">
    <div class="brand"><div class="logo">C</div><div><strong>ClubOps AI</strong><span>Event operations</span></div></div>
    <nav id="nav"></nav>
    
<div class="sidebar-bottom">
  <div class="mini-card" data-view="assistant" style="cursor:pointer;">
    <span class="status-dot"></span>
    <div>
      <b>AI Assistant</b>
      <small>Ready to help</small>
    </div>
  </div>
</div>  </aside>
  <main class="main">
    <header class="topbar"><div class="mobile-brand">ClubOps AI</div><div class="search"><span>⌕</span>
    <div class="search-wrapper">
  <input
    id="globalSearch"
    placeholder="Search tasks, people, events..."
    autocomplete="off"
  />

  <div id="searchResults" class="search-results"></div>
</div>
</div><div class="top-actions"><button class="icon-btn" id="notifyBtn" title="Notifications">🔔<i></i></button><button class="avatar" id="userAvatar">U</button></div></header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<style>
  #authRoot {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f7fb;
    padding: 20px;
    box-sizing: border-box;
  }

  .auth-card {
    width: 100%;
    max-width: 430px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 32px;
    box-sizing: border-box;
    box-shadow: 0 18px 50px rgba(15,23,42,.10);
  }

  .auth-logo {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #111827;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 18px;
  }

  .auth-title {
    margin: 0;
    font-size: 25px;
    color: #18212f;
  }

  .auth-subtitle {
    margin: 7px 0 25px;
    color: #697386;
    font-size: 13px;
    line-height: 1.5;
  }

  .auth-field {
    margin-bottom: 15px;
  }

  .auth-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #344054;
    margin-bottom: 6px;
  }

  .auth-field input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 13px;
    border: 1px solid #d9dee7;
    border-radius: 9px;
    outline: none;
    font-size: 13px;
    background: white;
  }

  .auth-field input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
  }

  .auth-button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 5px;
  }

  .auth-button:hover {
    background: #1d4ed8;
  }

  .auth-switch {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #697386;
  }

  .auth-switch button {
    border: 0;
    background: none;
    color: #2563eb;
    cursor: pointer;
    font-weight: 600;
  }

  .auth-error {
    background: #fef2f2;
    color: #b42318;
    border: 1px solid #fecaca;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 15px;
    display: none;
  }

  .auth-success {
    background: #ecfdf3;
    color: #027a48;
    border: 1px solid #abefc6;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 15px;
    display: none;
  }
</style>
<script src="app.js"></script>
</body>
</html>
